<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>青岛摄影机位地图 · 精确机位版</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #0a1628; color: #e8e8e8; height: 100vh; overflow: hidden; }
    .header { background: linear-gradient(135deg, #1a2a3a 0%, #0d1b2a 100%); padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(100, 200, 255, 0.12); box-shadow: 0 4px 20px rgba(0,0,0,0.3); flex-shrink: 0; }
    .header h1 { font-size: 17px; font-weight: 600; background: linear-gradient(90deg, #4fc3f7, #81d4fa, #b3e5fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
    .header .sub { font-size: 11px; color: #546e7a; margin-top: 2px; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .search-box { background: rgba(255,255,255,0.06); border: 1px solid rgba(100, 200, 255, 0.12); border-radius: 18px; padding: 5px 12px; font-size: 12px; color: #e0e0e0; width: 170px; outline: none; }
    .search-box::placeholder { color: #455a64; }
    .search-box:focus { border-color: #4fc3f7; }
    .badge { background: rgba(79, 195, 247, 0.12); border: 1px solid rgba(79, 195, 247, 0.25); border-radius: 16px; padding: 4px 12px; font-size: 11px; color: #4fc3f7; white-space: nowrap; }
    .container { display: flex; height: calc(100vh - 54px); }
    .sidebar { width: 380px; background: #111d2e; border-right: 1px solid rgba(100, 200, 255, 0.08); overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; }
    .sidebar::-webkit-scrollbar { width: 5px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(79, 195, 247, 0.25); border-radius: 3px; }
    .sidebar-header { padding: 10px 14px; border-bottom: 1px solid rgba(100, 200, 255, 0.06); position: sticky; top: 0; background: #111d2e; z-index: 100; }
    .filter-tabs { display: flex; gap: 5px; flex-wrap: wrap; }
    .ftab { padding: 3px 10px; border-radius: 14px; font-size: 11px; cursor: pointer; border: 1px solid rgba(100, 200, 255, 0.12); background: transparent; color: #78909c; transition: all 0.2s; user-select: none; white-space: nowrap; }
    .ftab:hover { border-color: #4fc3f7; color: #4fc3f7; }
    .ftab.active { background: rgba(79, 195, 247, 0.18); border-color: #4fc3f7; color: #4fc3f7; }
    .route-sec { padding: 8px 14px; border-bottom: 1px solid rgba(100, 200, 255, 0.06); }
    .route-title { font-size: 11px; font-weight: 600; color: #546e7a; margin-bottom: 6px; letter-spacing: 1px; }
    .route-btns { display: flex; gap: 5px; flex-wrap: wrap; }
    .rbtn { padding: 3px 9px; border-radius: 10px; font-size: 11px; cursor: pointer; border: 1px solid rgba(255, 200, 100, 0.15); background: rgba(255, 200, 100, 0.06); color: #b8860b; transition: all 0.2s; }
    .rbtn:hover { background: rgba(255, 200, 100, 0.15); border-color: #daa520; }
    .rbtn.active { background: rgba(255, 200, 100, 0.22); border-color: #daa520; color: #ffd700; }
    .spot-list { padding: 4px; flex: 1; overflow-y: auto; }
    .sgt { font-size: 10px; color: #455a64; padding: 6px 12px 3px; font-weight: 600; letter-spacing: 1px; }
    .sgroup { margin-bottom: 8px; }
    .sgroup-h { padding: 6px 12px; font-size: 12px; font-weight: 600; color: #81d4fa; background: rgba(79, 195, 247, 0.06); border-bottom: 1px solid rgba(79, 195, 247, 0.08); display: flex; align-items: center; gap: 6px; }
    .sgroup-h .cnt { font-size: 10px; color: #546e7a; font-weight: 400; }
    .spot-card { display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px; cursor: pointer; transition: all 0.2s; border-bottom: 1px solid rgba(100, 200, 255, 0.04); }
    .spot-card:hover { background: rgba(79, 195, 247, 0.06); }
    .spot-card.active { background: rgba(79, 195, 247, 0.1); border-color: rgba(79, 195, 247, 0.18); }
    .sico { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; margin-top: 2px; }
    .sinfo { flex: 1; min-width: 0; }
    .sname { font-size: 12px; font-weight: 600; color: #e0e0e0; margin-bottom: 1px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .sname .area-tag { font-size: 9px; color: #546e7a; font-weight: 400; }
    .hot { font-size: 9px; padding: 1px 5px; border-radius: 6px; background: rgba(255, 82, 82, 0.18); color: #ff5252; font-weight: 500; }
    .pro { font-size: 9px; padding: 1px 5px; border-radius: 6px; background: rgba(171, 71, 188, 0.18); color: #ab47bc; font-weight: 500; }
    .spose { font-size: 11px; color: #4fc3f7; font-weight: 500; margin-bottom: 2px; }
    .sdesc { font-size: 10px; color: #607d8b; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .stags { display: flex; gap: 3px; margin-top: 3px; flex-wrap: wrap; }
    .stag { font-size: 9px; padding: 1px 6px; border-radius: 7px; }
    .t-sea { background: rgba(77, 182, 172, 0.12); color: #4db6ac; }
    .t-sunrise { background: rgba(255, 183, 77, 0.12); color: #ffb74d; }
    .t-sunset { background: rgba(255, 138, 101, 0.12); color: #ff8a65; }
    .t-night { background: rgba(149, 119, 213, 0.12); color: #9577d5; }
    .t-bldg { background: rgba(255, 167, 38, 0.12); color: #ffa726; }
    .t-rom { background: rgba(236, 112, 140, 0.12); color: #ec708c; }
    .t-film { background: rgba(129, 199, 132, 0.12); color: #81c784; }
    .t-aerial { background: rgba(159, 168, 210, 0.12); color: #9fa8da; }
    .map-box { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; background: #0d1b2a; }
    .leaflet-tile-pane { transition: opacity 0.2s; }
    .leaflet-tile-container img { will-change: transform; }
    .leaflet-control-attribution { display: none !important; }
    .info-panel { position: absolute; bottom: 14px; left: 14px; width: 420px; max-height: 62vh; overflow-y: auto; background: rgba(17, 29, 46, 0.97); backdrop-filter: blur(12px); border-radius: 14px; padding: 18px; border: 1px solid rgba(100, 200, 255, 0.12); display: none; animation: su 0.3s ease; z-index: 1000; }
    @keyframes su { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .info-panel.show { display: block; }
    .ih { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .iname { font-size: 15px; font-weight: 600; color: #4fc3f7; }
    .iclose { width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(100, 200, 255, 0.18); background: transparent; color: #78909c; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; }
    .ipose { font-size: 12px; color: #81d4fa; font-weight: 500; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(100, 200, 255, 0.08); }
    .idets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    .idet { background: rgba(79, 195, 247, 0.06); border-radius: 8px; padding: 8px; }
    .idet-l { font-size: 10px; color: #546e7a; margin-bottom: 3px; }
    .idet-v { font-size: 11px; color: #cfd8dc; font-weight: 500; line-height: 1.3; }
    .isection { margin-bottom: 10px; }
    .isec-t { font-size: 11px; font-weight: 600; color: #81d4fa; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
    .isec-c { font-size: 11px; color: #90a4ae; line-height: 1.5; }
    .iacts { display: flex; gap: 6px; }
    .ibtn { flex: 1; padding: 7px 8px; border-radius: 8px; border: 1px solid rgba(100, 200, 255, 0.15); background: transparent; color: #4fc3f7; font-size: 11px; cursor: pointer; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 4px; transition: all 0.2s; }
    .ibtn:hover { background: rgba(79, 195, 247, 0.12); }
    .ibtn.p { background: rgba(79, 195, 247, 0.18); border-color: #4fc3f7; }
    .stats { position: absolute; top: 12px; right: 12px; background: rgba(17, 29, 46, 0.9); backdrop-filter: blur(10px); border-radius: 10px; padding: 8px 12px; border: 1px solid rgba(100, 200, 255, 0.1); display: flex; gap: 12px; z-index: 999; }
    .si { text-align: center; }
    .sn { font-size: 16px; font-weight: 700; color: #4fc3f7; }
    .sl { font-size: 9px; color: #546e7a; }
    .area-f { position: absolute; top: 12px; left: 12px; background: rgba(17, 29, 46, 0.9); backdrop-filter: blur(10px); border-radius: 10px; padding: 8px 12px; border: 1px solid rgba(100, 200, 255, 0.1); z-index: 999; }
    .at { font-size: 10px; color: #546e7a; margin-bottom: 5px; font-weight: 600; }
    .atabs { display: flex; gap: 3px; flex-wrap: wrap; }
    .atab { padding: 3px 8px; border-radius: 8px; font-size: 10px; cursor: pointer; border: 1px solid rgba(100, 200, 255, 0.1); background: transparent; color: #546e7a; transition: all 0.2s; }
    .atab:hover { border-color: #4fc3f7; color: #4fc3f7; }
    .atab.active { background: rgba(79, 195, 247, 0.18); border-color: #4fc3f7; color: #4fc3f7; }
    .legend { position: absolute; bottom: 14px; right: 14px; background: rgba(17, 29, 46, 0.9); backdrop-filter: blur(10px); border-radius: 10px; padding: 10px 12px; border: 1px solid rgba(100, 200, 255, 0.1); z-index: 999; }
    .lt { font-size: 10px; color: #546e7a; margin-bottom: 5px; font-weight: 600; }
    .li { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .ldot { width: 8px; height: 8px; border-radius: 50%; }
    .ltx { font-size: 10px; color: #78909c; }
    .cm { position: relative; cursor: pointer; }
    .mp { width: 28px; height: 28px; border-radius: 50% 50% 50% 0; position: absolute; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.2); }
    .mp .me { transform: rotate(45deg); font-size: 13px; }
    .ml { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); background: rgba(17, 29, 46, 0.9); color: #cfd8dc; padding: 1px 5px; border-radius: 6px; font-size: 9px; white-space: nowrap; border: 1px solid rgba(100, 200, 255, 0.12); }
    .leaflet-popup-content-wrapper { background: #111d2e !important; color: #cfd8dc !important; border: 1px solid rgba(100, 200, 255, 0.18) !important; border-radius: 10px !important; box-shadow: 0 8px 32px rgba(0,0,0,0.4) !important; }
    .leaflet-popup-tip { background: #111d2e !important; border: 1px solid rgba(100, 200, 255, 0.18) !important; }
    .leaflet-popup-close-button { color: #4fc3f7 !important; }
    @media (max-width: 768px) { .container { flex-direction: column; } .sidebar { width: 100%; height: 38%; border-right: none; border-bottom: 1px solid rgba(100, 200, 255, 0.08); } .map-box { height: 62%; } .info-panel { left: 8px; right: 8px; width: auto; bottom: 8px; } .idets { grid-template-columns: repeat(2, 1fr); } .search-box { width: 130px; } }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>📷 青岛摄影机位地图 · 精确机位版</h1>
      <div class="sub">整合小红书 · 视觉中国 · 500px · 蜂鸟网 · 知乎 · 今日头条 · 马蜂窝 · 十六番</div>
    </div>
    <div class="header-right">
      <input type="text" class="search-box" id="searchBox" placeholder="🔍 搜索机位...">
      <div class="badge" id="spotCount">0 个机位</div>
    </div>
  </div>
  <div class="container">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="filter-tabs">
          <div class="ftab active" data-f="all">全部</div>
          <div class="ftab" data-f="sea">海景</div>
          <div class="ftab" data-f="bldg">建筑</div>
          <div class="ftab" data-f="sunset">日落</div>
          <div class="ftab" data-f="sunrise">日出</div>
          <div class="ftab" data-f="night">夜景</div>
          <div class="ftab" data-f="rom">文艺</div>
          <div class="ftab" data-f="aerial">航拍</div>
        </div>
      </div>
      <div class="route-sec">
        <div class="route-title">📍 经典拍摄路线</div>
        <div class="route-btns">
          <div class="rbtn" data-r="ot">老城一日</div>
          <div class="rbtn" data-r="cl">环海线</div>
          <div class="rbtn" data-r="wc">西海岸</div>
          <div class="rbtn" data-r="ls">崂山线</div>
          <div class="rbtn" data-r="nt">夜景线</div>
          <div class="rbtn" data-r="wed">婚纱旅拍</div>
        </div>
      </div>
      <div class="spot-list" id="spotList"></div>
    </div>
    <div class="map-box">
      <div id="map"></div>
      <div class="area-f">
        <div class="at">区域筛选</div>
        <div class="atabs">
          <div class="atab active" data-a="all">全部</div>
          <div class="atab" data-a="市南">市南区</div>
          <div class="atab" data-a="崂山">崂山区</div>
          <div class="atab" data-a="黄岛">西海岸</div>
          <div class="atab" data-a="市北">市北区</div>
          <div class="atab" data-a="李沧">李沧区</div>
          <div class="atab" data-a="即墨">即墨区</div>
        </div>
      </div>
      <div class="stats">
        <div class="si"><div class="sn" id="sn">0</div><div class="sl">精确机位</div></div>
        <div class="si"><div class="sn" id="sa">0</div><div class="sl">景点覆盖</div></div>
        <div class="si"><div class="sn">6</div><div class="sl">区域覆盖</div></div>
        <div class="si"><div class="sn">6</div><div class="sl">拍摄路线</div></div>
      </div>
      <div class="legend">
        <div class="lt">图例</div>
        <div class="li"><div class="ldot" style="background:#ff5252"></div><div class="ltx">热门爆款机位</div></div>
        <div class="li"><div class="ldot" style="background:#ab47bc"></div><div class="ltx">视觉中国/500px 收录</div></div>
        <div class="li"><div class="ldot" style="background:#4fc3f7"></div><div class="ltx">普通推荐机位</div></div>
      </div>
      <div class="info-panel" id="infoPanel">
        <div class="ih"><div class="iname" id="iname"></div><button class="iclose" id="iclose">✕</button></div>
        <div class="ipose" id="ipose"></div>
        <div class="idets" id="idets"></div>
        <div id="iExtra"></div>
        <div class="iacts" id="iacts"></div>
      </div>
    </div>
  </div>

  <script>
    // 每个机位包含: name(景点名), spot(具体机位名称), area, lng, lat, emoji, pose(机位描述/站哪), ref(参照物/前景背景), angle(拍摄朝向/角度), compose(构图建议), cat, tags, tc, r, hot, pro, bt, bs, tip, nav(导航目标)
    const spots = [
      // ====== 栈桥 ======
      { id:1, name:'栈桥', spot:'回澜阁往岸拍经典构图', area:'市南', lng:120.3194, lat:36.0617, emoji:'🌊', cat:['sea','bldg','aerial'], tags:['海景','地标','航拍'], tc:['sea','aerial'], r:['ot'], hot:true, pro:true,
        pose:'站在栈桥尽头的回澜阁上，面向岸边方向拍摄',
        ref:'前景：人字形栈桥桥身当前景引导线 | 中景：海面与海鸥 | 背景：小青岛白色灯塔+城市天际线',
        angle:'朝向西北方向，竖屏拍摄把栈桥+小青岛一同收入画面',
        compose:'用长焦(70-200mm)压缩空间，让栈桥和远处的灯塔产生纵深感。低角度贴桥面拍能增强引导线效果。退潮时礁石露出，前景更有层次。',
        bt:'清晨 6:00-8:00 或日落前', bs:'全年（冬春海鸥季更佳）', tip:'退潮拍礁石层次注意防滑。清晨游客最少。航拍俯瞰最壮观。',
        nav:'栈桥回澜阁' },
      { id:2, name:'栈桥', spot:'东侧拍夜景', area:'市南', lng:120.3220, lat:36.0620, emoji:'🌃', cat:['night','sea'], tags:['夜景','地标'], tc:['night'], r:['nt'],
        pose:'站在栈桥东侧的沙滩上，面向栈桥方向拍摄',
        ref:'前景：东侧沙滩/礁石 | 中景：栈桥桥身+回澜阁亮灯 | 背景：老城区灯光',
        angle:'朝向西南，横拍展现栈桥侧面夜景轮廓',
        compose:'涨潮时海面如镜，回澜阁灯光倒映在海面上。带三脚架拍慢门，水面丝滑效果。满月之夜海面有月光倒影更梦幻。',
        bt:'夜晚 19:00-22:00', bs:'全年', tip:'东侧角度比正面更有层次感，涨潮比退潮效果好。',
        nav:'栈桥东侧沙滩' },
      { id:3, name:'栈桥', spot:'退潮礁石+海鸥', area:'市南', lng:120.3180, lat:36.0605, emoji:'🐦', cat:['sea','sunrise'], tags:['海鸥','礁石','生态'], tc:['sea'], r:['ot'],
        pose:'退潮后走到栈桥两侧露出的礁石上，低机位拍摄',
        ref:'前景：红色礁石+海浪泡沫 | 中景：栈桥桥墩 | 背景：回澜阁+海鸥群',
        angle:'低角度仰拍，用广角(16-35mm)把礁石纹理和天空纳入',
        compose:'海鸥飞翔时抓拍，用快门优先(1/1000s以上)冻结动作。红礁石与蓝海对比鲜明，是很好的色彩构图元素。',
        bt:'退潮时（查潮汐表）', bs:'11月-次年4月海鸥季', tip:'务必查潮汐表，礁石湿滑穿防滑鞋。海鸥季带长焦抓拍。',
        nav:'栈桥' },

      // ====== 圣弥厄尔教堂 ======
      { id:4, name:'圣弥厄尔教堂', spot:'正面广场对称构图', area:'市南', lng:120.3240, lat:36.0660, emoji:'⛪', cat:['bldg'], tags:['建筑','德式','婚纱'], tc:['bldg'], r:['ot','wed'], hot:true, pro:true,
        pose:'站在教堂正前方的广场中央，面向教堂拍摄',
        ref:'前景：广场地面+人群 | 中景：教堂双塔正面 | 背景：蓝天',
        angle:'正对教堂，居中对称构图，竖拍突出双塔高度',
        compose:'用超广角(14-24mm)拍出气势，教堂占画面2/3。阳光穿透彩色玻璃窗时，内侧拍摄有斑斓光影。婚纱旅拍必去机位。',
        bt:'上午 9:00-11:00（顺光）', bs:'全年', tip:'避开周末人流，侧面下坡处咖啡店前拍红墙+教堂也出片。',
        nav:'圣弥厄尔教堂' },
      { id:5, name:'圣弥厄尔教堂', spot:'下坡路文创街视角', area:'市南', lng:120.3230, lat:36.0655, emoji:'🧱', cat:['bldg','rom'], tags:['文艺','街拍','咖啡'], tc:['rom'], r:['ot'],
        pose:'从教堂侧面下坡处的文创街/咖啡店方向，仰拍教堂侧面',
        ref:'前景：咖啡店招牌/文创小店 | 中景：教堂侧墙+钟楼 | 背景：红瓦屋顶',
        angle:'仰角30-45度，斜侧方拍教堂，红墙和绿树形成色彩对比',
        compose:'用50mm或85mm定焦拍特写，红墙+教堂双塔的经典构图。咖啡店外摆的桌椅当前景，有生活气息。',
        bt:'下午', bs:'全年', tip:'咖啡店消费后可以坐在窗前拍教堂侧影。',

        pose:'世博园园区内高处或航拍',

        pose:'温泉区面向大海的方向',
        ref:'前景：温泉雾气 | 中景：人物在温泉中 | 背景：前方大海',
        angle:'侧拍温泉+大海的对比构图',

        nav:'即墨温泉海泉湾' },

      // ====== 田横岛 ======
      { id:80, name:'田横岛', spot:'原始海岛航拍', area:'即墨', lng:120.7200, lat:36.3200, emoji:'🏝️', cat:['sea','aerial'], tags:['海岛','航拍','原始'], tc:['aerial'], r:[], pro:true,
        pose:'航拍田横岛全岛',
        ref:'前景：海面 | 中景：原始海岛地貌 | 背景：海天一线',
        angle:'航拍俯瞰全岛，展现原始风貌',
        compose:'即墨最出名的海岛，视觉中国有航拍收录。岛上保留着原始风貌，周围海水清澈。航拍展示海岛全貌非常壮观。',
        bt:'上午', bs:'夏秋', tip:'航拍最出片，岛上原始风貌值得探索。',
        nav:'田横岛' }
    ];

    const CC = { sea:'#4db6ac', bldg:'#ffa726', sunset:'#ff8a65', sunrise:'#ffb74d', night:'#9577d5', rom:'#ec708c', aerial:'#9fa8da' };
    const AO = ['市南','崂山','黄岛','市北','李沧','即墨'];
    const AN = { '市南':'市南区', '崂山':'崂山区', '黄岛':'西海岸', '市北':'市北区', '李沧':'李沧区', '即墨':'即墨区' };

    let map=null, markers={}, curF='all', curA='all', curR=null, searchT='';

    // Group spots by name (parent location)
    function getGroups() {
      const g = {};
      spots.forEach(s => {
        if (!g[s.name]) g[s.name] = { name: s.name, area: s.area, spots: [], emoji: s.emoji };
        g[s.name].spots.push(s);
      });
      return g;
    }

    function getVisibleSpots() {
      return spots.filter(s => {
        if (curF!=='all' && !s.cat.includes(curF)) return false;
        if (curA!=='all' && s.area!==curA) return false;
        if (curR && (!s.r || !s.r.includes(curR))) return false;
        if (searchT && !s.name.includes(searchT) && !s.spot.includes(searchT) && !s.desc.includes(searchT)) return false;
        return true;
      });
    }

    function renderList() {
      const list = document.getElementById('spotList');
      list.innerHTML = '';
      const visible = getVisibleSpots();
      document.getElementById('spotCount').textContent = `${visible.length} 个机位`;
      document.getElementById('sn').textContent = visible.length;
      // count unique parent names
      const uniqueNames = new Set(visible.map(s => s.name));
      document.getElementById('sa').textContent = uniqueNames.size;

      const g = {};
      visible.forEach(s => {
        const key = s.area + '|' + s.name;
        if (!g[key]) g[key] = { name: s.name, area: s.area, emoji: s.emoji, spots: [] };
        g[key].spots.push(s);
      });

      AO.forEach(area => {
        const areaGroups = {};
        Object.entries(g).forEach(([key, val]) => {
          if (val.area === area) areaGroups[key] = val;
        });
        if (Object.keys(areaGroups).length === 0) return;

        const at = document.createElement('div'); at.className='sgt';
        at.textContent = `── ${AN[area]} (${Object.values(areaGroups).reduce((a,b)=>a+b.spots.length,0)} 机位) ──`;
        list.appendChild(at);

        Object.entries(areaGroups).forEach(([key, grp]) => {
          const sg = document.createElement('div'); sg.className='sgroup';
          const sh = document.createElement('div'); sh.className='sgroup-h';
          sh.innerHTML = `${grp.emoji} ${grp.name} <span class="cnt">${grp.spots.length} 个机位</span>`;
          sg.appendChild(sh);

          grp.spots.forEach(s => {
            const c = document.createElement('div'); c.className='spot-card'; c.dataset.id=s.id;
            const th = s.tags.map((t,i) => `<span class="stag t-${s.tc[i]||'sea'}">${t}</span>`).join('');
            c.innerHTML = `<div class="sico" style="background:${CC[s.cat[0]]}18">${s.emoji}</div>
              <div class="sinfo">
                <div class="sname">${s.spot}</div>
                <div class="spose">${s.pose}</div>
                <div class="sdesc">${s.compose}</div>
                <div class="stags">${th}</div>
              </div>`;
            c.addEventListener('click', () => flyTo(s.id));
            sg.appendChild(c);
          });
          list.appendChild(sg);
        });
      });
    }

    document.querySelectorAll('.ftab').forEach(t => t.addEventListener('click', () => {
      document.querySelectorAll('.ftab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active'); curF=t.dataset.f; renderList(); updateM();
    }));
    document.querySelectorAll('.atab').forEach(t => t.addEventListener('click', () => {
      document.querySelectorAll('.atab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active'); curA=t.dataset.a; renderList(); updateM();
    }));
    document.querySelectorAll('.rbtn').forEach(t => t.addEventListener('click', () => {
      const was = t.classList.contains('active');
      document.querySelectorAll('.rbtn').forEach(x=>x.classList.remove('active'));
      curR = was ? null : t.dataset.r;
      if (curR) t.classList.add('active');
      renderList(); updateM();
    }));
    document.getElementById('searchBox').addEventListener('input', e => { searchT=e.target.value; renderList(); updateM(); });

    function initMap() {
      map = L.map('map', { center:[36.062,120.420], zoom:11, zoomControl:false, zoomAnimation:true, markerZoomAnimation:true });
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { subdomains:'abcd', maxZoom:20, maxNativeZoom:18, keepBuffer:4, updateWhenZooming:false }).addTo(map);
      L.control.zoom({ position:'topright' }).addTo(map);
      spots.forEach(s => {
        const ic = L.divIcon({ className:'',
          html:`<div class="cm"><div class="ml">${s.spot}</div><div class="mp" style="background:${CC[s.cat[0]]};${s.pro?'border:2px solid rgba(171,71,188,0.5);':''}"><span class="me">${s.emoji}</span></div></div>`,
          iconSize:[28,36], iconAnchor:[14,36], popupAnchor:[0,-36] });
        const m = L.marker([s.lat,s.lng], {icon:ic}).addTo(map);
        m.on('click', () => showInfo(s));
        markers[s.id] = m;
      });
    }

    function updateM() {
      spots.forEach(s => {
        const m = markers[s.id]; if (!m) return;
        let show = true;
        if (curF!=='all' && !s.cat.includes(curF)) show=false;
        if (curA!=='all' && s.area!==curA) show=false;
        if (curR && (!s.r || !s.r.includes(curR))) show=false;
        if (searchT && !s.name.includes(searchT) && !s.spot.includes(searchT)) show=false;
        show ? map.addLayer(m) : map.removeLayer(m);
      });
    }

    function flyTo(id) {
      const s = spots.find(x=>x.id===id); if (!s) return;
      map.flyTo([s.lat,s.lng], 15, { duration:0.8 });
      document.querySelectorAll('.spot-card').forEach(c=>c.classList.remove('active'));
      const c = document.querySelector(`.spot-card[data-id="${id}"]`);
      if (c) { c.classList.add('active'); c.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
      showInfo(s);
    }

    function showInfo(s) {
      const p = document.getElementById('infoPanel');
      document.getElementById('iname').innerHTML = `${s.emoji} ${s.name} ${s.hot?'<span class="hot">热门</span>':''} ${s.pro?'<span class="pro">专业收录</span>':''}`;
      document.getElementById('ipose').textContent = `📍 ${s.spot} — ${s.pose}`;
      document.getElementById('idets').innerHTML = `
        <div class="idet"><div class="idet-l">📸 最佳时间</div><div class="idet-v">${s.bt}</div></div>
        <div class="idet"><div class="idet-l">🗓️ 最佳季节</div><div class="idet-v">${s.bs}</div></div>
        <div class="idet"><div class="idet-l">💡 提示</div><div class="idet-v">${s.tip}</div></div>`;
      let extra = '';
      extra += `<div class="isection"><div class="isec-t">🎯 参照物</div><div class="isec-c">${s.ref}</div></div>`;
      extra += `<div class="isection"><div class="isec-t">📐 拍摄角度</div><div class="isec-c">${s.angle}</div></div>`;
      extra += `<div class="isection"><div class="isec-t">🖼️ 构图建议</div><div class="isec-c">${s.compose}</div></div>`;
      document.getElementById('iExtra').innerHTML = extra;
      const nav = `https://uri.amap.com/marker?position=${s.lng},${s.lat}&name=${encodeURIComponent(s.nav||s.name)}&callnative=1`;
      const view = `https://www.amap.com/search?query=${encodeURIComponent(s.nav||s.name+' 青岛')}&city=370200`;
      document.getElementById('iacts').innerHTML = `
        <a href="${nav}" target="_blank" class="ibtn p">📍 高德导航</a>
        <a href="${view}" target="_blank" class="ibtn">🗺️ 高德查看</a>`;
      p.classList.add('show');
    }

    document.getElementById('iclose').addEventListener('click', () => { document.getElementById('infoPanel').classList.remove('show'); });

    renderList();
    initMap();
    setTimeout(() => { map.invalidateSize(); }, 200);
    window.addEventListener('resize', () => { map.invalidateSize(); });
  </script>
