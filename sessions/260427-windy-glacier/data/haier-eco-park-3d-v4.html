<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海尔科创生态园 - 1:1比例3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; background: #1a1a2e; }
        #canvas { width: 100vw; height: 100vh; display: block; }
        .title-bar {
            position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
            z-index: 100; background: rgba(15,25,50,0.9); padding: 10px 28px;
            border-radius: 8px; color: white; text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.4); backdrop-filter: blur(6px);
            border: 1px solid rgba(100,150,255,0.2);
        }
        .title-bar h1 { font-size: 18px; margin-bottom: 2px; letter-spacing: 1px; }
        .title-bar p { font-size: 10px; opacity: 0.6; }
        .ctrl-panel {
            position: fixed; top: 80px; left: 12px; z-index: 100;
            display: flex; flex-direction: column; gap: 5px;
        }
        .btn {
            background: rgba(255,255,255,0.85); border: none; padding: 7px 14px;
            border-radius: 5px; cursor: pointer; font-size: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15); transition: all 0.15s;
        }
        .btn:hover { background: rgba(40,100,200,0.9); color: white; }
        .info-card {
            position: fixed; right: 12px; top: 80px; width: 280px; z-index: 100;
            background: rgba(255,255,255,0.95); border-radius: 8px; padding: 16px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.2); display: none;
            max-height: 65vh; overflow-y: auto; backdrop-filter: blur(8px);
        }
        .info-card.show { display: block; }
        .info-card h3 { color: #2563eb; margin-bottom: 10px; font-size: 15px; border-bottom: 2px solid #2563eb; padding-bottom: 6px; }
        .info-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #f0f0f0; font-size: 12px; }
        .info-label { color: #999; }
        .info-value { color: #333; font-weight: 600; }
        .stat-bar {
            position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
            z-index: 100; background: rgba(15,25,50,0.9); padding: 8px 24px;
            border-radius: 8px; box-shadow: 0 3px 12px rgba(0,0,0,0.3);
            display: flex; gap: 24px; backdrop-filter: blur(6px);
            border: 1px solid rgba(100,150,255,0.15);
        }
        .stat-item { text-align: center; }
        .stat-num { font-size: 16px; font-weight: 700; color: #60a5fa; }
        .stat-label { font-size: 10px; color: #94a3b8; margin-top: 1px; }
        .compass {
            position: fixed; bottom: 60px; right: 12px; z-index: 100;
            width: 44px; height: 44px; background: rgba(255,255,255,0.9);
            border-radius: 50%; display: flex; justify-content: center;
            align-items: center; font-weight: 700; font-size: 11px; color: #dc2626;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .loading-overlay {
            position: fixed; inset: 0; background: #0f1a32;
            display: flex; justify-content: center; align-items: center; z-index: 9999;
            color: white; font-size: 18px; flex-direction: column; gap: 14px;
        }
        .loading-overlay.hidden { display: none; }
        .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #60a5fa; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div>正在加载海尔科创生态园3D场景...</div>
    </div>
    <div class="title-bar">
        <h1>海尔科创生态园 1:1比例</h1>
        <p>青岛崂山区海尔路1号 | 120.424932°E, 36.129963°N</p>
    </div>
    <div class="ctrl-panel">
        <button class="btn" onclick="toggleDayNight()">🌓 昼夜</button>
        <button class="btn" onclick="resetCam()">🎯 重置</button>
        <button class="btn" onclick="setView('bird')">🦅 鸟瞰</button>
        <button class="btn" onclick="setView('front')">🏢 正面</button>
        <button class="btn" onclick="setView('side')">📐 侧面</button>
        <button class="btn" onclick="toggleLabels()">🏷️ 标签</button>
        <button class="btn" onclick="toggleRotate()">🔄 旋转</button>
    </div>
    <div class="info-card" id="infoCard">
        <h3 id="infoTitle">建筑信息</h3>
        <div id="infoBody"></div>
    </div>
    <div class="stat-bar">
        <div class="stat-item"><div class="stat-num">1100亩</div><div class="stat-label">总占地</div></div>
        <div class="stat-item"><div class="stat-num">38.5万㎡</div><div class="stat-label">二期建面</div></div>
        <div class="stat-item"><div class="stat-num">1.2万人</div><div class="stat-label">容量</div></div>
        <div class="stat-item"><div class="stat-num">8栋</div><div class="stat-label">建筑</div></div>
    </div>
    <div class="compass">N</div>
    <canvas id="canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
    <script>
    (function() {
        // === 场景初始化 ===
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 2000);
        camera.position.set(180, 120, 180);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;

        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.setSize(innerWidth, innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.maxPolarAngle = Math.PI / 2.05;
        controls.minDistance = 30;
        controls.maxDistance = 500;
        controls.target.set(0, 0, 0);

        // === 光照 ===
        const ambient = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xfff5e6, 0.9);
        sun.position.set(80, 120, 60);
        sun.castShadow = true;
        sun.shadow.mapSize.set(4096, 4096);
        sun.shadow.camera.near = 1;
        sun.shadow.camera.far = 400;
        sun.shadow.camera.left = -200;
        sun.shadow.camera.right = 200;
        sun.shadow.camera.top = 200;
        sun.shadow.camera.bottom = -200;
        sun.shadow.bias = -0.0005;
        scene.add(sun);
        const fill = new THREE.DirectionalLight(0x8888ff, 0.12);
        fill.position.set(-60, 40, -80);
        scene.add(fill);

        // === 天空 ===
        const skyGeo = new THREE.SphereGeometry(900, 32, 16);
        const skyMat = new THREE.ShaderMaterial({
            uniforms: {
                topColor: { value: new THREE.Color(0x1e40af) },
                bottomColor: { value: new THREE.Color(0xbfdbfe) },
                offset: { value: 20 }, exponent: { value: 0.5 }
            },
            vertexShader: `varying vec3 vWP;void main(){vec4 wp=modelMatrix*vec4(position,1.0);vWP=wp.xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
            fragmentShader: `uniform vec3 topColor;uniform vec3 bottomColor;uniform float offset;uniform float exponent;varying vec3 vWP;void main(){float h=normalize(vWP+offset).y;gl_FragColor=vec4(mix(bottomColor,topColor,max(pow(max(h,0.0),exponent),0.0)),1.0);}`,
            side: THREE.BackSide
        });
        scene.add(new THREE.Mesh(skyGeo, skyMat));

        // === 材质缓存 ===
        const matCache = {};
        function mat(c, o={}) {
            const k = c + JSON.stringify(o);
            if (!matCache[k]) matCache[k] = new THREE.MeshStandardMaterial({ color: c, roughness: o.r||0.7, metalness: o.m||0.1, ...o });
            return matCache[k];
        }

        // === 生成玻璃幕墙纹理 ===
        function glassTex(w, h, baseColor) {
            const c = document.createElement('canvas');
            c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');

            // 基色
            ctx.fillStyle = baseColor || '#c8dce8';
            ctx.fillRect(0, 0, 512, 512);

            const floors = Math.max(2, Math.floor(h / 4));
            const floorH = 512 / floors;

            for (let f = 0; f < floors; f++) {
                const y = f * floorH;
                // 楼层分隔线
                ctx.fillStyle = '#a0b0c0';
                ctx.fillRect(0, y, 512, 2);

                // 窗户面板
                const panels = Math.max(4, Math.floor(w / 4));
                const pw = 512 / panels;
                for (let p = 0; p < panels; p++) {
                    // 玻璃渐变
                    const g = ctx.createLinearGradient(p*pw, y+2, (p+1)*pw, y+floorH);
                    g.addColorStop(0, '#b0d0e8');
                    g.addColorStop(0.3, '#d0e8f4');
                    g.addColorStop(0.7, '#c0d8e8');
                    g.addColorStop(1, '#a0c0d8');
                    ctx.fillStyle = g;
                    ctx.fillRect(p*pw+2, y+4, pw-4, floorH-6);
                    // 窗框
                    ctx.strokeStyle = '#8899aa';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(p*pw+2, y+4, pw-4, floorH-6);
                }
            }

            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // === 建筑数据（基于公开信息推算的1:1比例）===
        // 总建筑面积38.5万㎡ = 7栋主楼 + 1餐厅
        // 按公开信息估算各楼栋面积比例
        const bldgs = [
            {
                name: '中央研究院 C01',
                x: 0, z: 0,
                // 约8万㎡，假设标准层1500㎡，约16层
                w: 68, d: 28, h: 65,
                color: '#1e3a5f',
                info: { '楼栋': 'C01 中央研究院', '建筑面积': '约8万㎡', '楼层': '约16层', '高度': '约65m', '功能': '集团核心研发机构' }
            },
            {
                name: 'C02 空气生态创新中心',
                x: 85, z: -45,
                w: 55, d: 26, h: 48,
                color: '#2563a0',
                info: { '楼栋': 'C02 空气生态创新中心', '建筑面积': '约5万㎡', '楼层': '约12层', '高度': '约48m', '功能': '空气生态创新研发' }
            },
            {
                name: 'C03 食联生态创新中心',
                x: -85, z: -45,
                w: 52, d: 26, h: 46,
                color: '#15803d',
                info: { '楼栋': 'C03 食联生态创新中心', '建筑面积': '约5万㎡', '楼层': '约11层', '高度': '约46m', '功能': '食品生态创新研发' }
            },
            {
                name: 'C04 衣联&水联生态创新中心',
                x: 85, z: 45,
                w: 52, d: 25, h: 44,
                color: '#7c3aed',
                info: { '楼栋': 'C04 衣联&水联生态创新中心', '建筑面积': '约4.5万㎡', '楼层': '约11层', '高度': '约44m', '功能': '衣物水生态创新研发' }
            },
            {
                name: 'C05 食联生态实验大楼',
                x: -85, z: 45,
                w: 46, d: 22, h: 32,
                color: '#16a34a',
                info: { '楼栋': 'C05 食联生态实验大楼', '建筑面积': '约3.5万㎡', '楼层': '约8层', '高度': '约32m', '功能': '食品生态实验测试' }
            },
            {
                name: 'C06 空气实验大楼',
                x: 130, z: 0,
                w: 42, d: 22, h: 30,
                color: '#0284c7',
                info: { '楼栋': 'C06 空气实验大楼', '建筑面积': '约3万㎡', '楼层': '约8层', '高度': '约30m', '功能': '空气技术实验验证' }
            },
            {
                name: 'C07 综合配套楼',
                x: -130, z: 0,
                w: 50, d: 24, h: 38,
                color: '#64748b',
                info: { '楼栋': 'C07 综合配套楼', '建筑面积': '约4万㎡', '楼层': '约10层', '高度': '约38m', '功能': '园区综合服务办公' }
            },
            {
                name: 'D01 员工阳光餐厅',
                x: 0, z: 100,
                w: 48, d: 38, h: 14,
                color: '#d97706',
                isDining: true,
                info: { '楼栋': 'D01 员工阳光餐厅', '建筑面积': '约1.5万㎡', '楼层': '3层', '高度': '约14m', '功能': '园区餐饮服务中心' }
            }
        ];

        // === 建筑创建 ===
        const bldgGroup = new THREE.Group();
        scene.add(bldgGroup);
        const clickable = [];
        const labels = [];

        bldgs.forEach(b => {
            const grp = new THREE.Group();
            const { w, d, h, color, isDining } = b;

            // 基座
            const baseH = 2;
            const base = new THREE.Mesh(
                new THREE.BoxGeometry(w+4, baseH, d+4),
                mat('#d0d0d0', {r:0.6})
            );
            base.position.y = baseH/2;
            base.receiveShadow = true;
            grp.add(base);

            // 主体 - 玻璃幕墙
            const tex = glassTex(w, h, color);
            const bodyMat = new THREE.MeshStandardMaterial({
                map: tex, roughness: 0.35, metalness: 0.3
            });
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(w, h - baseH, d),
                bodyMat
            );
            body.position.y = baseH + (h-baseH)/2;
            body.castShadow = true;
            body.receiveShadow = true;
            grp.add(body);
            clickable.push({ mesh: body, data: b });

            // 水平分隔线（白色线条勾勒）
            const floorH = 4;
            const nf = Math.floor((h-baseH)/floorH);
            for (let i = 1; i < nf; i++) {
                const line = new THREE.Mesh(
                    new THREE.BoxGeometry(w+0.3, 0.2, d+0.3),
                    mat('#e8e8e8', {r:0.4})
                );
                line.position.y = baseH + i*floorH;
                grp.add(line);
            }

            // 垂直装饰线条
            for (let side = 0; side < 4; side++) {
                const vLines = side % 2 === 0 ? Math.floor(w/6) : Math.floor(d/6);
                const vLen = side % 2 === 0 ? w : d;
                for (let j = 0; j <= vLines; j++) {
                    const vLine = new THREE.Mesh(
                        new THREE.BoxGeometry(0.15, h, 0.15),
                        mat('#c0c8d0', {r:0.3, m:0.2})
                    );
                    const offset = j * (vLen/vLines) - vLen/2;
                    if (side === 0) vLine.position.set(offset, h/2, d/2+0.1);
                    else if (side === 1) vLine.position.set(offset, h/2, -d/2-0.1);
                    else if (side === 2) vLine.position.set(w/2+0.1, h/2, offset);
                    else vLine.position.set(-w/2-0.1, h/2, offset);
                    grp.add(vLine);
                }
            }

            // 楼顶装饰
            if (h > 35 && !isDining) {
                // 设备间
                const eq = new THREE.Mesh(
                    new THREE.BoxGeometry(w*0.2, 3, d*0.2),
                    mat('#8090a0', {r:0.5, m:0.3})
                );
                eq.position.y = h + 1.5;
                eq.castShadow = true;
                grp.add(eq);
                // 避雷针
                const rod = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.12, 0.12, 8),
                    mat('#909090', {m:0.4})
                );
                rod.position.y = h + 7;
                grp.add(rod);
            }

            if (isDining) {
                // 阳光餐厅 - 玻璃穹顶
                const dome = new THREE.Mesh(
                    new THREE.SphereGeometry(Math.min(w,d)*0.3, 16, 8, 0, Math.PI*2, 0, Math.PI/2),
                    new THREE.MeshStandardMaterial({
                        color: '#fbbf24', transparent: true, opacity: 0.7,
                        roughness: 0.1, metalness: 0.5, side: THREE.DoubleSide
                    })
                );
                dome.position.y = h;
                dome.castShadow = true;
                grp.add(dome);
            }

            // 入口雨棚
            const canopy = new THREE.Mesh(
                new THREE.BoxGeometry(10, 0.25, 4),
                mat('#b0b8c0', {r:0.3, m:0.3})
            );
            canopy.position.set(0, baseH+0.12, d/2+2);
            grp.add(canopy);

            grp.position.set(b.x, 0, b.z);
            bldgGroup.add(grp);

            // 标签
            const div = document.createElement('div');
            div.textContent = b.name;
            div.style.cssText = 'background:rgba(30,64,175,0.85);color:#fff;padding:3px 9px;border-radius:4px;font-size:10px;font-family:Microsoft YaHei;white-space:nowrap;pointer-events:auto;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,0.2);';
            div.addEventListener('click', () => showInfo(b.info));
            const lbl = new THREE.CSS2DObject(div);
            lbl.position.set(0, h+10, 0);
            grp.add(lbl);
            labels.push(lbl);
        });

        // === 地面 ===
        // 园区占地约1100亩=733333㎡，二期约500x400m
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(700, 600),
            mat('#b5b0a5', {r:0.95})
        );
        ground.rotation.x = -Math.PI/2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 绿化基底
        const grass = new THREE.Mesh(
            new THREE.PlaneGeometry(600, 500),
            mat('#5a8c3c', {r:0.98})
        );
        grass.rotation.x = -Math.PI/2;
        grass.position.y = 0.02;
        grass.receiveShadow = true;
        scene.add(grass);

        // === 道路系统 ===
        function addRoad(x, z, rw, rl, axis) {
            const geo = new THREE.PlaneGeometry(axis==='x'?rl:rw, axis==='x'?rw:rl);
            const m = new THREE.Mesh(geo, mat('#555555', {r:0.8}));
            m.rotation.x = -Math.PI/2;
            m.position.set(x, 0.03, z);
            m.receiveShadow = true;
            scene.add(m);
            // 中线
            const lg = new THREE.PlaneGeometry(axis==='x'?rl*0.9:0.12, axis==='x'?0.12:rl*0.9);
            const lm = new THREE.Mesh(lg, mat('#fbbf24', {r:0.5}));
            lm.rotation.x = -Math.PI/2;
            lm.position.set(x, 0.04, z);
            scene.add(lm);
            // 边线
            [-1,1].forEach(side => {
                const eg = new THREE.PlaneGeometry(axis==='x'?rl*0.9:0.08, axis==='x'?0.08:rl*0.9);
                const em = new THREE.Mesh(eg, mat('#ffffff', {r:0.6}));
                em.rotation.x = -Math.PI/2;
                em.position.set(x + (axis==='x'?0:side*(rw/2-0.15)), 0.04, z + (axis==='x'?side*(rw/2-0.15):0));
                scene.add(em);
            });
        }
        // 主干道（东西+南北）
        addRoad(0, 0, 12, 350, 'x');
        addRoad(0, 0, 12, 350, 'z');
        // 次干道
        addRoad(0, -90, 8, 280, 'x');
        addRoad(0, 90, 8, 280, 'x');
        addRoad(-130, 0, 8, 250, 'z');
        addRoad(130, 0, 8, 250, 'z');
        // 内部环路
        addRoad(0, -45, 7, 170, 'x');
        addRoad(0, 45, 7, 170, 'x');
        addRoad(-85, 0, 7, 200, 'z');
        addRoad(85, 0, 7, 200, 'z');

        // === 人行道 ===
        function addSidewalk(x, z, sw, sl, axis) {
            const geo = new THREE.PlaneGeometry(axis==='x'?sl:sw, axis==='x'?sw:sl);
            const m = new THREE.Mesh(geo, mat('#c8c0b5', {r:0.7}));
            m.rotation.x = -Math.PI/2;
            m.position.set(x, 0.05, z);
            m.receiveShadow = true;
            scene.add(m);
        }
        [-6.5, 6.5].forEach(offset => {
            addSidewalk(0, offset, 2, 350, 'x');
            addSidewalk(offset, 0, 2, 350, 'z');
        });

        // === 停车场 ===
        function addParking(x, z, cols, rows) {
            const g = new THREE.Group();
            const pg = new THREE.PlaneGeometry(cols*5.5+2, rows*9+2);
            const pm = new THREE.Mesh(pg, mat('#484848', {r:0.75}));
            pm.rotation.x = -Math.PI/2; pm.receiveShadow = true; g.add(pm);
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    const sg = new THREE.PlaneGeometry(4.5, 8);
                    const sm = new THREE.Mesh(sg, mat(Math.random()>0.35?'#505050':'#404040', {r:0.7}));
                    sm.rotation.x = -Math.PI/2;
                    sm.position.set(i*5.5-cols*2.75+2.75, 0.02, j*9-rows*4.5+4.5);
                    g.add(sm);
                }
            }
            // 停车位标线
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    const lg = new THREE.PlaneGeometry(4.5, 0.08);
                    const lm = new THREE.Mesh(lg, mat('#ffffff', {r:0.4}));
                    lm.rotation.x = -Math.PI/2;
                    lm.position.set(i*5.5-cols*2.75+2.75, 0.03, j*9-rows*4.5);
                    g.add(lm);
                }
            }
            g.position.set(x, 0.05, z);
            return g;
        }
        scene.add(addParking(-175, -100, 5, 3));
        scene.add(addParking(175, -100, 5, 3));
        scene.add(addParking(-175, 100, 5, 3));

        // === 广场 ===
        const plaza = new THREE.Mesh(
            new THREE.CircleGeometry(25, 32),
            mat('#c4a87a', {r:0.6})
        );
        plaza.rotation.x = -Math.PI/2;
        plaza.position.set(0, 0.06, 72);
        plaza.receiveShadow = true;
        scene.add(plaza);

        // 喷泉
        const fb = new THREE.Mesh(
            new THREE.CylinderGeometry(6, 8, 1.5, 24),
            mat('#8ab4c8', {r:0.15, m:0.4})
        );
        fb.position.set(0, 0.75, 72);
        scene.add(fb);

        const waterMesh = new THREE.Mesh(
            new THREE.CylinderGeometry(0.35, 0.6, 6, 12),
            new THREE.MeshStandardMaterial({color:0x88ccee, transparent:true, opacity:0.6, roughness:0.05})
        );
        waterMesh.position.set(0, 4.5, 72);
        scene.add(waterMesh);

        // === 花坛 ===
        function addFlowerBed(x, z, r) {
            const g = new THREE.Group();
            const ring = new THREE.Mesh(
                new THREE.TorusGeometry(r, 0.5, 8, 16),
                mat('#888', {r:0.6})
            );
            ring.rotation.x = -Math.PI/2;
            ring.position.y = 0.3;
            g.add(ring);
            const soil = new THREE.Mesh(
                new THREE.CircleGeometry(r, 16),
                mat('#4a3728', {r:0.9})
            );
            soil.rotation.x = -Math.PI/2;
            soil.position.y = 0.35;
            g.add(soil);
            g.position.set(x, 0, z);
            return g;
        }
        [[-30,72],[30,72],[0,55],[0,90]].forEach(([x,z]) => scene.add(addFlowerBed(x,z,3)));

        // === 树木 ===
        function addTree(x, z, s=1) {
            const g = new THREE.Group();
            const tk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.35*s, 0.6*s, 3*s, 6),
                mat('#6b4423', {r:0.9})
            );
            tk.position.y = 1.5*s; tk.castShadow = true; g.add(tk);
            // 多层树冠
            [[2.5, 5], [2, 6.5], [1.3, 7.8]].forEach(([r, y]) => {
                const cr = new THREE.Mesh(
                    new THREE.SphereGeometry(r*s, 7, 6),
                    mat('#2d8a4e', {r:0.85})
                );
                cr.position.y = y*s; cr.castShadow = true; g.add(cr);
            });
            g.position.set(x, 0, z);
            return g;
        }
        // 沿道路种树
        const treePos = [];
        for (let i = -160; i <= 160; i += 18) {
            treePos.push([i, -78], [i, 78]);
        }
        for (let i = -120; i <= 120; i += 22) {
            treePos.push([-78, i], [78, i]);
        }
        // 园区边缘
        for (let a = 0; a < 360; a += 15) {
            const rad = a * Math.PI / 180;
            treePos.push([Math.cos(rad)*185, Math.sin(rad)*150]);
        }
        treePos.forEach(([x, z]) => {
            if (Math.abs(x)<40 && Math.abs(z)<40) return;
            scene.add(addTree(x+(Math.random()-0.5)*4, z+(Math.random()-0.5)*4, 0.6+Math.random()*0.5));
        });

        // === 信息面板 ===
        window.showInfo = function(info) {
            const card = document.getElementById('infoCard');
            document.getElementById('infoTitle').textContent = info['楼栋'] || '建筑信息';
            let html = '';
            for (const [k,v] of Object.entries(info)) {
                if (k !== '楼栋') html += `<div class="info-row"><span class="info-label">${k}</span><span class="info-value">${v}</span></div>`;
            }
            document.getElementById('infoBody').innerHTML = html;
            card.classList.add('show');
        };

        // === 点击交互 ===
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        renderer.domElement.addEventListener('click', e => {
            mouse.x = (e.clientX/innerWidth)*2-1;
            mouse.y = -(e.clientY/innerHeight)*2+1;
            raycaster.setFromCamera(mouse, camera);
            clickable.forEach(({mesh, data}) => {
                if (raycaster.intersectObject(mesh).length > 0) {
                    showInfo(data.info);
                    const oc = mesh.material.emissive ? mesh.material.emissive.getHex() : 0;
                    mesh.material.emissive = new THREE.Color(0x223355);
                    setTimeout(() => mesh.material.emissive = new THREE.Color(oc), 400);
                }
            });
        });

        // 悬停
        renderer.domElement.addEventListener('mousemove', e => {
            mouse.x = (e.clientX/innerWidth)*2-1;
            mouse.y = -(e.clientY/innerHeight)*2+1;
            raycaster.setFromCamera(mouse, camera);
            let hit = false;
            clickable.forEach(({mesh}) => { if(raycaster.intersectObject(mesh).length>0) hit=true; });
            renderer.domElement.style.cursor = hit ? 'pointer' : 'grab';
        });

        // === 控制 ===
        let isNight = false;
        window.toggleDayNight = function() {
            isNight = !isNight;
            if (isNight) {
                ambient.intensity = 0.12; sun.intensity = 0.04;
                renderer.toneMappingExposure = 0.5;
                skyMat.uniforms.topColor.value.set(0x050520);
                skyMat.uniforms.bottomColor.value.set(0x0a0a30);
            } else {
                ambient.intensity = 0.5; sun.intensity = 0.9;
                renderer.toneMappingExposure = 1.1;
                skyMat.uniforms.topColor.value.set(0x1e40af);
                skyMat.uniforms.bottomColor.value.set(0xbfdbfe);
            }
        };

        window.resetCam = function() {
            camera.position.set(180, 120, 180); controls.target.set(0,0,0);
        };
        window.setView = function(v) {
            if(v==='bird'){camera.position.set(0,260,0.1);controls.target.set(0,0,0);}
            else if(v==='front'){camera.position.set(0,35,200);controls.target.set(0,20,0);}
            else if(v==='side'){camera.position.set(200,35,0);controls.target.set(0,20,0);}
        };
        let labelsVis = true;
        window.toggleLabels = function() {
            labelsVis = !labelsVis;
            labels.forEach(l => l.visible = labelsVis);
        };
        window.toggleRotate = function() {
            controls.autoRotate = !controls.autoRotate;
            controls.autoRotateSpeed = 1.5;
        };

        addEventListener('resize', () => {
            camera.aspect = innerWidth/innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
            labelRenderer.setSize(innerWidth, innerHeight);
        });

        // 动画
        let t = 0;
        function animate() {
            requestAnimationFrame(animate);
            t += 0.016;
            waterMesh.scale.y = 1 + Math.sin(t*4)*0.2;
            waterMesh.position.y = 4.5 + Math.sin(t*4)*0.7;
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        document.getElementById('loading').classList.add('hidden');
        animate();
    })();
    </script>
</body>
</html>
